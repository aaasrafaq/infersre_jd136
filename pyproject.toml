[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aaasrafaq-infersre_jd136"
version = "0.1.0"
description = "在同一个输入里两两比对，检测推理服务 SRE 工程师·检索召回的漏斗分析相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "aaasrafaq" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://aaasrafaq.github.io"
Repository = "https://github.com/aaasrafaq/infersre_jd136"
Issues = "https://github.com/aaasrafaq/infersre_jd136/issues"

[project.scripts]
infersre_jd136 = "infersre_jd136:main"

[tool.setuptools]
py-modules = ["infersre_jd136"]
